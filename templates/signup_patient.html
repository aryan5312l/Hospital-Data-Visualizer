{% extends "base.html" %}

{% block title %}Patient Sign Up - Hospital Management System{% endblock %}
{% block page_title %}Create Patient Account{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-body p-4">
                <form id="signupForm">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">First Name</label>
                                <input type="text" class="form-control" id="first_name" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Last Name</label>
                                <input type="text" class="form-control" id="last_name" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Username</label>
                                <input type="text" class="form-control" id="username" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Email</label>
                                <input type="email" class="form-control" id="email" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Password</label>
                                <input type="password" class="form-control" id="password" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Date of Birth</label>
                                <input type="date" class="form-control" id="date_of_birth" required>
                            </div>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Gender</label>
                                <select class="form-select" id="gender" required>
                                    <option value="">Select gender</option>
                                    <option value="Male">Male</option>
                                    <option value="Female">Female</option>
                                </select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="mb-3">
                                <label class="form-label">Phone</label>
                                <input type="text" class="form-control" id="phone" required>
                            </div>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Address</label>
                        <input type="text" class="form-control" id="address" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Emergency Contact</label>
                        <input type="text" class="form-control" id="emergency_contact" placeholder="Name - Phone" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Preferred Doctor (optional)</label>
                        <select class="form-select" id="doctor_id">
                            <option value="">No preference</option>
                        </select>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Create Account</button>
                    </div>
                    <div class="text-center mt-3">
                        <a href="/">Back to Login</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    </div>
{% endblock %}

{% block scripts %}
<script>
// Load doctors for dropdown
document.addEventListener('DOMContentLoaded', async function() {
    try {
        const res = await fetch('/api/public/doctors');
        const doctors = await res.json();
        const sel = document.getElementById('doctor_id');
        sel.innerHTML = '<option value="">No preference</option>' + doctors.map(d => `<option value="${d.id}">${d.name} - ${d.specialization}</option>`).join('');
    } catch (e) { /* ignore */ }
});

document.getElementById('signupForm').addEventListener('submit', async function(e) {
    e.preventDefault();
    const payload = {
        role: 'patient',
        username: document.getElementById('username').value.trim(),
        email: document.getElementById('email').value.trim(),
        password: document.getElementById('password').value,
        first_name: document.getElementById('first_name').value.trim(),
        last_name: document.getElementById('last_name').value.trim(),
        date_of_birth: document.getElementById('date_of_birth').value,
        gender: document.getElementById('gender').value,
        phone: document.getElementById('phone').value.trim(),
        address: document.getElementById('address').value.trim(),
        emergency_contact: document.getElementById('emergency_contact').value.trim()
    };

    try {
        const res = await fetch('/api/register', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok) {
            alert(data.message || 'Sign up failed');
            return;
        }

        // Auto login and redirect to patient dashboard
        const loginRes = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username: payload.username, password: payload.password })
        });
        const loginData = await loginRes.json();
        if (loginRes.ok) {
            localStorage.setItem('token', loginData.access_token);
            localStorage.setItem('userRole', loginData.user.role);
            window.location.href = '/patient';
        } else {
            window.location.href = '/';
        }
    } catch (err) {
        alert('Network error. Please try again.');
    }
});
</script>
{% endblock %}
